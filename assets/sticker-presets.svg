<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="100%" height="auto" role="img" aria-labelledby="presetsTitle presetsDesc">
  <title id="presetsTitle">Standard Die-Cut Sticker Sheet Presets (A4 &amp; US Letter)</title>
  <desc id="presetsDesc">Visual overview of the 6 sticker sheet presets supported by Barcode Label Studio.</desc>

