      <rect x="128" y="0" width="4" height="76" />
      <rect x="136" y="0" width="8" height="76" />
      <rect x="148" y="0" width="2" height="76" />
      <rect x="154" y="0" width="4" height="76" />
      <rect x="162" y="0" width="6" height="76" />
      <rect x="172" y="0" width="2" height="76" />
      <rect x="178" y="0" width="4" height="76" />
      <rect x="186" y="0" width="6" height="76" />
      <rect x="196" y="0" width="2" height="76" />
      <rect x="202" y="0" width="6" height="76" />
    </g>
    <text x="130" y="138" fill="#0f172a" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">4820019472</text>
  </g>

  <!-- Card 2: QR Code with Brand Logo Overlay -->
  <g transform="translate(970, 38)" filter="url(#shadow)">
    <rect width="184" height="164" rx="12" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="14" y="12" width="76" height="18" rx="4" fill="#dcfce7" />
    <text x="52" y="24" fill="#15803d" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">QR + LOGO</text>
    <text x="170" y="24" fill="#475569" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" text-anchor="end">v2 (25×25)</text>

    <!-- Stylized QR Matrix -->
    <g transform="translate(44, 38)" fill="#0f172a">
      <!-- Top-Left Finder -->
      <path d="M0,0 h28 v28 h-28 z M4,4 v20 h20 v-20 z M8,8 h12 v12 h-12 z" fill-rule="evenodd" />
      <!-- Top-Right Finder -->
      <path d="M68,0 h28 v28 h-28 z M72,4 v20 h20 v-20 z M76,8 h12 v12 h-12 z" fill-rule="evenodd" />
      <!-- Bottom-Left Finder -->
      <path d="M0,68 h28 v28 h-28 z M4,72 v20 h20 v-20 z M8,76 h12 v12 h-12 z" fill-rule="evenodd" />
      <!-- Data modules -->
      <rect x="36" y="4" width="8" height="8" />
      <rect x="48" y="4" width="4" height="12" />
      <rect x="56" y="8" width="8" height="8" />
      <rect x="36" y="20" width="12" height="4" />
      <rect x="4" y="36" width="8" height="8" />
      <rect x="16" y="40" width="8" height="12" />
      <rect x="4" y="52" width="12" height="8" />
      <rect x="76" y="36" width="8" height="8" />
      <rect x="84" y="48" width="12" height="8" />
      <rect x="72" y="60" width="8" height="12" />
      <rect x="36" y="76" width="8" height="8" />
      <rect x="52" y="72" width="12" height="8" />
      <rect x="44" y="84" width="16" height="8" />
      <rect x="68" y="80" width="16" height="16" />
      <rect x="72" y="84" width="8" height="8" fill="#ffffff" />
      <rect x="74" y="86" width="4" height="4" />
      <!-- Center Brand Badge -->
      <rect x="32" y="32" width="32" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
      <rect x="36" y="36" width="24" height="24" rx="4" fill="#2563eb" />
      <text x="48" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BLS</text>
    </g>
    <text x="92" y="150" fill="#475569" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" text-anchor="middle">ISO/IEC 18004</text>
  </g>

  <!-- Card 3: Batch Avery Die-Cut Sticker Sheet Preview -->
  <g transform="translate(690, 218)" filter="url(#shadow)">
    <rect width="464" height="164" rx="12" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="18" y="25" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Batch Sticker Sheet Print — Avery A4 (3×8) &amp; US Letter (3×10)</text>
    <rect x="358" y="10" width="90" height="20" rx="4" fill="#dbeafe" />
    <text x="403" y="24" fill="#1d4ed8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">100% @page</text>

    <!-- 3x2 Sticker Grid Preview -->
    <g transform="translate(18, 38)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <rect width="136" height="50" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="3,2" />
        <path d="M18,10 v22 M22,10 v22 M28,10 v22 M32,10 v22 M38,10 v22 M44,10 v22 M48,10 v22 M54,10 v22 M60,10 v22 M66,10 v22 M72,10 v22 M78,10 v22 M84,10 v22 M90,10 v22 M96,10 v22 M102,10 v22 M108,10 v22 M114,10 v22" stroke="#0f172a" stroke-width="2" />
        <text x="68" y="44" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">SN-00101</text>
      </g>
      <g transform="translate(146, 0)">
        <rect width="136" height="50" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="3,2" />
        <path d="M18,10 v22 M24,10 v22 M28,10 v22 M34,10 v22 M40,10 v22 M44,10 v22 M50,10 v22 M56,10 v22 M62,10 v22 M66,10 v22 M72,10 v22 M78,10 v22 M82,10 v22 M88,10 v22 M94,10 v22 M100,10 v22 M106,10 v22 M114,10 v22" stroke="#0f172a" stroke-width="2" />
        <text x="68" y="44" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">SN-00102</text>
      </g>
      <g transform="translate(292, 0)">
        <rect width="136" height="50" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="3,2" />
        <path d="M18,10 v22 M22,10 v22 M26,10 v22 M32,10 v22 M38,10 v22 M44,10 v22 M50,10 v22 M54,10 v22 M60,10 v22 M66,10 v22 M70,10 v22 M76,10 v22 M82,10 v22 M88,10 v22 M94,10 v22 M102,10 v22 M108,10 v22 M114,10 v22" stroke="#0f172a" stroke-width="2" />
        <text x="68" y="44" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">SN-00103</text>
      </g>
      <!-- Row 2 -->
      <g transform="translate(0, 58)">
        <rect width="136" height="50" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="3,2" />
        <path d="M18,10 v22 M24,10 v22 M30,10 v22 M34,10 v22 M40,10 v22 M46,10 v22 M52,10 v22 M58,10 v22 M62,10 v22 M68,10 v22 M74,10 v22 M80,10 v22 M86,10 v22 M90,10 v22 M96,10 v22 M102,10 v22 M108,10 v22 M114,10 v22" stroke="#0f172a" stroke-width="2" />
        <text x="68" y="44" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">SN-00104</text>
      </g>
      <g transform="translate(146, 58)">
        <rect width="136" height="50" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="3,2" />
        <path d="M18,10 v22 M22,10 v22 M28,10 v22 M34,10 v22 M40,10 v22 M46,10 v22 M50,10 v22 M56,10 v22 M62,10 v22 M68,10 v22 M74,10 v22 M78,10 v22 M84,10 v22 M90,10 v22 M96,10 v22 M102,10 v22 M108,10 v22 M114,10 v22" stroke="#0f172a" stroke-width="2" />
        <text x="68" y="44" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">SN-00105</text>
      </g>
      <g transform="translate(292, 58)">
        <rect width="136" height="50" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="3,2" />
