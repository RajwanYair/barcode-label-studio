<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Barcode Label Studio — Zero-Backend 1D &amp; 2D QR Barcode &amp; Sticker Sheet Printing Studio</title>
  <desc id="heroDesc">Hero banner showcasing single barcode generation, QR code with logo overlay, and Avery A4/US Letter batch sticker sheet printing.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#111d3a" />
      <stop offset="100%" stop-color="#0f2942" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.45" />
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="18" fill="url(#grid)" opacity="0.45" />

  <!-- Decorative glow -->
  <circle cx="950" cy="90" r="180" fill="#2563eb" opacity="0.18" />
  <circle cx="820" cy="340" r="160" fill="#0ea5e9" opacity="0.14" />

  <!-- Left Column: Branding & Value Proposition -->
  <g transform="translate(56, 54)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="308" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="18" cy="15" r="5" fill="#22c55e" />
    <text x="32" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.4">ZERO-BACKEND • SINGLE HTML FILE • MIT LICENSE</text>

    <!-- Main Title -->
    <text x="0" y="84" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">Barcode Label Studio</text>
    <text x="0" y="122" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="600">1D &amp; 2D QR Barcode Engine + Batch Sticker Sheet Printing</text>

    <!-- Description -->
    <text x="0" y="162" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Standards-compliant Code 128B/C, Code 39, EAN-13, ITF, and ISO/IEC 18004 QR Codes</text>
    <text x="0" y="186" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">with custom brand logo embedding and physical millimeter Avery A4 &amp; US Letter sheets.</text>

    <!-- Feature Badges Row 1 -->
    <g transform="translate(0, 222)" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">
      <rect x="0" y="0" width="122" height="30" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="61" y="19" fill="#38bdf8" text-anchor="middle">Code 128 B/C</text>

      <rect x="132" y="0" width="96" height="30" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="180" y="19" fill="#38bdf8" text-anchor="middle">Code 39</text>

      <rect x="238" y="0" width="96" height="30" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="286" y="19" fill="#38bdf8" text-anchor="middle">EAN-13</text>

      <rect x="344" y="0" width="84" height="30" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="386" y="19" fill="#38bdf8" text-anchor="middle">ITF-14</text>

      <rect x="438" y="0" width="118" height="30" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="497" y="19" fill="#38bdf8" text-anchor="middle">QR v1–v6 ECC</text>
    </g>

    <!-- Feature Badges Row 2 -->
    <g transform="translate(0, 262)" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">
      <rect x="0" y="0" width="142" height="30" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="71" y="19" fill="#a7f3d0" text-anchor="middle">Logo Embedding</text>

      <rect x="152" y="0" width="166" height="30" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="235" y="19" fill="#a7f3d0" text-anchor="middle">Avery A4 &amp; US Letter</text>

      <rect x="328" y="0" width="148" height="30" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="402" y="19" fill="#a7f3d0" text-anchor="middle">CSV / XLSX Import</text>

      <rect x="486" y="0" width="128" height="30" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="550" y="19" fill="#a7f3d0" text-anchor="middle">SVG / 2x PNG</text>
    </g>
  </g>

  <!-- Right Column: Visual Workbench Cards -->
  <!-- Card 1: Single 1D Barcode Card -->
  <g transform="translate(690, 38)" filter="url(#shadow)">
    <rect width="260" height="164" rx="12" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="14" y="12" width="84" height="18" rx="4" fill="#e0f2fe" />
    <text x="56" y="24" fill="#0369a1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">CODE 128C</text>
    <text x="244" y="24" fill="#475569" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" text-anchor="end">Mod 103: 42</text>

    <!-- Barcode Bars -->
    <g transform="translate(26, 40)" fill="#0f172a">
      <rect x="0" y="0" width="4" height="76" />
      <rect x="6" y="0" width="2" height="76" />
      <rect x="12" y="0" width="6" height="76" />
      <rect x="22" y="0" width="2" height="76" />
      <rect x="26" y="0" width="4" height="76" />
