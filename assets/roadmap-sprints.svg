<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="100%" height="auto" role="img" aria-labelledby="roadSvgTitle roadSvgDesc">
  <title id="roadSvgTitle">Barcode Label Studio — 6-Sprint Engineering Roadmap</title>
  <desc id="roadSvgDesc">Visual sprint roadmap showing Sprint 1 (Completed) through Sprint 6 for continuous open-source development.</desc>
  <defs>
    <linearGradient id="roadBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
  </defs>

  <rect width="1200" height="310" rx="14" fill="url(#roadBg)" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="32" y="38" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">🗺️ Open-Source Engineering Sprints &amp; Continuous Delivery Roadmap</text>
  <text x="1168" y="38" fill="#059669" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" text-anchor="end">100% Free &amp; Open-Source (MIT)</text>

  <!-- Timeline Spine -->
  <line x1="60" y1="74" x2="1140" y2="74" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,4" />

  <!-- Sprint 1 -->
  <g transform="translate(24, 58)">
    <circle cx="92" cy="16" r="12" fill="#059669" stroke="#ffffff" stroke-width="3" />
    <rect x="0" y="36" width="184" height="196" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
    <text x="92" y="60" fill="#065f46" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">✅ SPRINT 1 (v1.0)</text>
    <text x="92" y="78" fill="#047857" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">COMPLETED</text>
    <text x="14" y="104" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="11.5">• Code 128, 39, EAN-13, ITF</text>
    <text x="14" y="124" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="11.5">• QR v1–v6 + Logo Badge</text>
    <text x="14" y="144" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="11.5">• Avery A4 &amp; Letter Sheets</text>
    <text x="14" y="164" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="11.5">• EN/HE RTL + Dark/Light</text>
    <text x="14" y="184" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="11.5">• 100% Function Test Gate</text>
  </g>

  <!-- Sprint 2 -->
  <g transform="translate(218, 58)">
    <circle cx="92" cy="16" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="3" />
    <rect x="0" y="36" width="184" height="196" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="92" y="60" fill="#1e40af" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">🏷️ SPRINT 2 (v1.1)</text>
    <text x="92" y="78" fill="#2563eb" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">SYMBOLOGIES</text>
    <text x="14" y="104" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• UPC-A (12-digit retail)</text>
    <text x="14" y="124" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• EAN-8 (small packages)</text>
    <text x="14" y="144" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• Codabar (labs/libraries)</text>
    <text x="14" y="164" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• QR ECC L/M/Q/H selector</text>
    <text x="14" y="184" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• DataMatrix ECC 200 2D</text>
  </g>

  <!-- Sprint 3 -->
  <g transform="translate(412, 58)">
    <circle cx="92" cy="16" r="12" fill="#7c3aed" stroke="#ffffff" stroke-width="3" />
    <rect x="0" y="36" width="184" height="196" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="92" y="60" fill="#5b21b6" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">📐 SPRINT 3 (v1.2)</text>
    <text x="92" y="78" fill="#7c3aed" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">SHEET DESIGNER</text>
    <text x="14" y="104" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• Custom mm/inch grid</text>
    <text x="14" y="124" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• Skip N used stickers</text>
    <text x="14" y="144" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• Multi-col CSV binding</text>
    <text x="14" y="164" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• Per-sticker title/subtitle</text>
    <text x="14" y="184" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• Zero-dep .zip bundler</text>
  </g>

  <!-- Sprint 4 -->
  <g transform="translate(606, 58)">
    <circle cx="92" cy="16" r="12" fill="#0284c7" stroke="#ffffff" stroke-width="3" />
    <rect x="0" y="36" width="184" height="196" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="92" y="60" fill="#075985" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">📷 SPRINT 4 (v1.3)</text>
    <text x="92" y="78" fill="#0284c7" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">SCAN &amp; VERIFY</text>
    <text x="14" y="104" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• WebRTC camera scanner</text>
    <text x="14" y="124" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• BarcodeDetector API</text>
    <text x="14" y="144" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• 1D scanline decoder</text>
    <text x="14" y="164" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• Quiet-zone ISO grader</text>
    <text x="14" y="184" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• Logo contrast warning</text>
  </g>

  <!-- Sprint 5 -->
  <g transform="translate(800, 58)">
    <circle cx="92" cy="16" r="12" fill="#d97706" stroke="#ffffff" stroke-width="3" />
    <rect x="0" y="36" width="184" height="196" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
    <text x="92" y="60" fill="#92400e" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">💾 SPRINT 5 (v1.4)</text>
    <text x="92" y="78" fill="#d97706" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">PWA &amp; TEMPLATES</text>
    <text x="14" y="104" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• Installable PWA app</text>
    <text x="14" y="124" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• Offline Service Worker</text>
    <text x="14" y="144" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• IndexedDB template save</text>
    <text x="14" y="164" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• Project .json export</text>
    <text x="14" y="184" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• Keyboard shortcuts</text>
  </g>

  <!-- Sprint 6 -->
  <g transform="translate(994, 58)">
    <circle cx="92" cy="16" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="3" />
    <rect x="0" y="36" width="184" height="196" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" />
    <text x="92" y="60" fill="#991b1b" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">🖨️ SPRINT 6 (v2.0)</text>
    <text x="92" y="78" fill="#dc2626" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">THERMAL DIRECT</text>
    <text x="14" y="104" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• Zebra ZPL II export</text>
    <text x="14" y="124" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• ESC/POS roll commands</text>
    <text x="14" y="144" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• WebUSB direct print</text>
    <text x="14" y="164" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• WebSerial roll output</text>
    <text x="14" y="184" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="11.5">• GS1-128 AI parser</text>
  </g>
</svg>
