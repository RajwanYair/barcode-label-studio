name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Fast Zero-Dep Test & Meta-Guard Suite
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Shallow checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run 100% Function, Config, SVG & Documentation Test Suite
        run: npm test


